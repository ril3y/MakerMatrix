[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MakerMatrix"
version = "0.1.0"
description = "A powerful, modern electronic parts inventory management system designed for makers, engineers, and electronics enthusiasts"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "MakerMatrix Contributors"}
]
keywords = ["inventory", "electronics", "parts", "management", "maker"]

# Dependencies are managed in requirements.txt
# Install with: pip install -r requirements.txt

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "critical: marks tests as critical security tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "physical_print: marks tests requiring a physical Brother QL printer",
    "skip_by_default: marks tests as skipped by default (must opt in explicitly)",
]
# MakerMatrix/tests recurses to its integration_tests/ and unit_tests/ subdirs.
# The repo-root tests/ directory holds backup + security suites and runs by default.
testpaths = ["MakerMatrix/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers -m \"not integration\""

[tool.mypy]
# Match the CI invocation: ignore third-party stubs and use the legacy
# no-strict-optional behavior. The gate (.github/workflows/backend-quality.yml)
# also passes --ignore-missing-imports and --no-strict-optional explicitly.
python_version = "3.12"
ignore_missing_imports = true
strict_optional = false

# SQLModel/SQLAlchemy: the class-level annotations (List["X"], Optional["X"])
# on Relationship / Field columns intentionally lie about runtime types — at
# runtime those attributes are InstrumentedAttribute / Column proxies that
# expose .ilike, .in_, .desc, etc. mypy can't reconcile the two, so we silence
# the resulting attr-defined / arg-type / call-overload noise in the modules
# that interact directly with the ORM. This is *targeted* suppression for a
# documented library limitation, not a blanket Any-pass.
[[tool.mypy.overrides]]
module = [
    "MakerMatrix.repositories.*",
    "MakerMatrix.services.data.dashboard_service",
    "MakerMatrix.services.data.tag_service",
    "MakerMatrix.services.data.part_service",
    "MakerMatrix.services.data.part_allocation_service",
    "MakerMatrix.services.data.location_service",
    "MakerMatrix.services.data.tool_service",
    "MakerMatrix.services.data.enrichment_data_mapper",
    "MakerMatrix.services.enhanced_import_service",
    "MakerMatrix.services.system.task_service",
    "MakerMatrix.services.printer.printer_manager_service",
    "MakerMatrix.routers.parts_routes",
    "MakerMatrix.routers.preview_routes",
    "MakerMatrix.routers.task_routes",
    "MakerMatrix.routers.task_route_factory",
    "MakerMatrix.routers.backup_routes",
    "MakerMatrix.routers.printer_routes",
    "MakerMatrix.routers.tag_routes",
    "MakerMatrix.routers.supplier_config_routes",
    "MakerMatrix.services.data.supplier_data_mapper",
    "MakerMatrix.services.system.bulk_enrichment_service",
    "MakerMatrix.tasks.price_update_task",
]
disable_error_code = [
    "attr-defined",
    "arg-type",
    "call-overload",
    "call-arg",
    "return-value",
    "assignment",
    "union-attr",
    "index",
    "operator",
    "dict-item",
    "misc",
]

# BeautifulSoup interaction (Tag/NavigableString/PageElement Union) defies
# mypy narrowing in scraping code paths; the suppliers/printers do runtime
# isinstance/hasattr checks instead.
[[tool.mypy.overrides]]
module = [
    "MakerMatrix.suppliers.base",
    "MakerMatrix.suppliers.bolt_depot",
    "MakerMatrix.suppliers.adafruit",
    "MakerMatrix.suppliers.seeed_studio",
    "MakerMatrix.suppliers.mouser",
    "MakerMatrix.suppliers.lcsc",
    "MakerMatrix.suppliers.mcmaster_carr",
    "MakerMatrix.suppliers.digikey",
    "MakerMatrix.suppliers.scrapers.web_scraper",
]
disable_error_code = [
    "attr-defined",
    "union-attr",
    "arg-type",
    "return-value",
    "assignment",
    "call-arg",
    "index",
    "operator",
    "override",
    "has-type",
]

# PIL/Pillow font handling — FreeTypeFont vs ImageFont union is not narrowable
# from the public API surface; we treat the two as interchangeable for sizing.
[[tool.mypy.overrides]]
module = [
    "MakerMatrix.services.printer.label_service",
    "MakerMatrix.services.printer.qr_service",
    "MakerMatrix.services.printer.preview_service",
    "MakerMatrix.services.printer.template_processor",
    "MakerMatrix.services.printer.emoji_render_service",
    "MakerMatrix.printers.drivers.brother_ql.driver",
    "MakerMatrix.printers.drivers.mock.driver",
    "MakerMatrix.routers.utility_routes",          # also does PIL image processing
]
disable_error_code = [
    "assignment",
    "arg-type",
    "return-value",
    "attr-defined",
    "union-attr",
]

# SQLModel base classes typed model_config as SQLModelConfig but every
# subclass uses pydantic ConfigDict; the values are compatible at runtime.
# Also covers the same Column-vs-Optional[str] mismatch on model classes.
[[tool.mypy.overrides]]
module = [
    "MakerMatrix.models.*",
]
disable_error_code = [
    "assignment",
    "attr-defined",
    "arg-type",
    "no-redef",
]

# Test files often poke at internal attributes, build Pydantic models with
# partial data, or reference fields that have since been removed. We don't
# want type errors in tests to block CI on the implementation side; the test
# suite itself enforces correctness via pytest.
[[tool.mypy.overrides]]
module = [
    "MakerMatrix.tests.*",
]
disable_error_code = [
    "attr-defined",
    "arg-type",
    "assignment",
    "return-value",
    "call-arg",
    "operator",
    "union-attr",
    "index",
    "dict-item",
]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | venv_test
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | MakerMatrix/frontend
)/
'''

[tool.vulture]
min_confidence = 80
exclude = [
    "venv_test/",
    "venv_test_new/",
    "*.pyc",
    "__pycache__/",
    "node_modules/",
    "dist/",
    "coverage/",
    ".pytest_cache/",
    ".git/",
    # Legacy/experimental code that may have unused components
    "MakerMatrix/lib/",
    # Task implementations that are registered via class discovery
    "MakerMatrix/tasks/",
    # Test utilities and fixtures
    "MakerMatrix/tests/conftest.py"
]

# Configuration for ignoring false positives
# Add paths to files with intentional unused code
ignore_names = [
    # Test fixtures that appear unused but are used by pytest
    "setup_*",
    "clean_*",
    "sample_*",
    "*_fixture",
    # Common test variables
    "client",
    "session",
    # Database engine parameter used in event handlers
    "connection_record",
    # Imports that are re-exported
    "LabelData",
    "PydanticField",
    "EnrichmentProfileModel",
    "DateTime",
    "Boolean",
    "Integer",
    "Text",
    "relationship",
    "Form",
    "OAuth2PasswordRequestForm",
    "GenericPartQuery",
    "UpdateQuantityRequest",
    "Coroutine",
    "user_models",
    "pytest_asyncio",
    "get_all_suppliers_info",
    "TaskSecurityError",
    "AsyncGenerator",
    # Abstract method parameters
    "print_config",
    # Pytest parametrize parameters that may not be directly used in test body
    "expected_error",
    # Pydantic model configuration
    "model_config",
    # Mock test attributes that appear unused
    "side_effect",
    "__aexit__",
    # FastAPI lifespan function
    "lifespan",
    # Task classes used by task system
    "*Task",
    # Exception handlers registered with FastAPI
    "*_handler",
    # Public API functions that may not be called internally
    "serve_*",
    # Test markers
    "pytestmark",
    # Task discovery functions
    "get_task_class",
    "list_available_tasks"
]

# Paths to ignore completely
ignore_decorators = [
    "@pytest.fixture",
    "@app.middleware",
    "@app.on_event"
]